standard:
  name: ello-repo-standard
  version: "1.0.0"
  mode: migrate

repo:
  name: bestuser-router-mcp
  type: library
  lifecycle: active
  repo_id: bestuser_router_mcp
  family: sigrank
  purpose: bestuser-router-mcp — intent layer MCP for SigRank queries.

structure:
  profile: library
  allowed_root_dirs_extra: [__tests__, eval, system-devin]
  allowed_root_files_extra: [.npmignore, cascade.mjs, glama.json, index.mjs, manifest.json, server.json, tools.mjs, DIRECTORY_SUBMISSION_CHECKLIST.md, MCP_SERVER_DESCRIPTION.md]
  document_roots: [docs]
  artifact_roots: [artifacts, eval]
  archive_roots: [archive, docs/archive]

naming:
  forbid_version_suffixes: true
  forbidden_suffixes: [_final, _final2, _new, _updated, _revised, _copy]

knowledge:
  okf_enabled: true
  okf_roots: [docs, .coord]
  okf_severity: warn

coordination:
  micro_enabled: true
  micro_root: .coord/micro
  macro_enabled: true
  macro_root: .coord/macro

github:
  ruleset_profile: solo-fast
  required_check: repo-standard
